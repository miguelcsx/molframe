[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "molframe"
version = "0.3.1"
description = "Structural bioinformatics on a columnar engine: read, select, measure, analyze and compare molecular structures"
readme = "README.md"
authors = [{ name = "Miguel Cárdenas", email = "miguelecsx@gmail.com" }]
keywords = ["structural-biology", "bioinformatics", "mmcif", "pdb", "protein", "molecular-structure"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = ["numpy>=2"]
# PEP 639. maturin gained full support for the SPDX expression and
# `license-files` in 1.9.0; the build backend below already requires 1.9.4.
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/miguelcsx/molframe"
Repository = "https://github.com/miguelcsx/molframe"
Issues = "https://github.com/miguelcsx/molframe/issues"
Documentation = "https://miguelcsx.github.io/molframe/"

[dependency-groups]
dev = ["pyright>=1.1.405", "pytest>=8"]

[tool.pyright]
include = ["python/molframe"]
typeCheckingMode = "strict"

[tool.maturin]
manifest-path = "crates/molframe-py/Cargo.toml"
python-source = "python"
module-name = "molframe._native"
# The stable ABI. `pyo3/extension-module` is gone: it disabled linking libpython
# for every target, which breaks `cargo test`, and pyo3 replaced it with the
# `PYO3_BUILD_EXTENSION_MODULE` environment variable, which maturin >= 1.9.4
# sets for extension-module builds. Keeping abi3 here rather than in the crate's
# Cargo.toml leaves the 18 tests that call `Python::initialize()` on the full
# interpreter API. Checked, without maturin and without a 3.12 interpreter, by
# PYO3_NO_PYTHON=1 PYO3_BUILD_EXTENSION_MODULE=1 cargo check -p molframe-py
# --features pyo3/abi3-py312 -- which compiles the same Py_LIMITED_API
# configuration, since PYO3_BUILD_EXTENSION_MODULE is what maturin sets. It is
# not in AGENTS.md §4: it is a packaging property that maturin already enforces
# when it produces the wheel, and alternating it with the default feature set
# rebuilds pyo3 on every green run.
# The floor is 3.12 because that is what Google Colab runs.
features = ["pyo3/abi3-py312"]
