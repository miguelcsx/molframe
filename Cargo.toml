[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/molframe/molframe"
description = "A batteries-included structural bioinformatics engine"

[workspace.dependencies]
molframe-core = { path = "crates/molframe-core", version = "0.1.0" }
molframe-engine = { path = "crates/molframe-engine", version = "0.1.0" }
molframe-audit = { path = "crates/molframe-audit", version = "0.1.0" }
molframe-analysis = { path = "crates/molframe-analysis", version = "0.1.0" }
molframe-adapters = { path = "crates/molframe-adapters", version = "0.1.0" }
molframe-cif = { path = "crates/molframe-cif", version = "0.1.0" }
molframe-bcif = { path = "crates/molframe-bcif", version = "0.1.0" }
molframe-chem = { path = "crates/molframe-chem", version = "0.1.0" }
molframe-compare = { path = "crates/molframe-compare", version = "0.1.0" }
molframe-geom = { path = "crates/molframe-geom", version = "0.1.0" }
molframe-fx = { path = "crates/molframe-fx", version = "0.1.0" }
molframe-ic = { path = "crates/molframe-ic", version = "0.1.0" }
molframe-pdb = { path = "crates/molframe-pdb", version = "0.1.0" }
molframe-mmap = { path = "crates/molframe-mmap", version = "0.1.0" }
molframe-interop = { path = "crates/molframe-interop", version = "0.1.0" }
molframe-modelcif = { path = "crates/molframe-modelcif", version = "0.1.0" }
molframe-query = { path = "crates/molframe-query", version = "0.1.0" }
molframe-seq = { path = "crates/molframe-seq", version = "0.1.0" }
molframe-spatial = { path = "crates/molframe-spatial", version = "0.1.0" }
molframe-surface = { path = "crates/molframe-surface", version = "0.1.0" }
molframe-traj = { path = "crates/molframe-traj", version = "0.1.0" }
molframe-validate = { path = "crates/molframe-validate", version = "0.1.0" }
molframe-xtal = { path = "crates/molframe-xtal", version = "0.1.0" }
molframe = { path = "crates/molframe", version = "0.1.0" }
molframe-bench = { path = "crates/molframe-bench" }

bytemuck = { version = "1", features = ["derive"] }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
flate2 = "1"
faer = { version = "0.24.4", default-features = false, features = ["std", "rayon"] }
glob = "0.3"
hashbrown = "0.16"
hoomd-gsd = "1.1"
hdf5-reader = { version = "0.9.1", default-features = false }
hdf5-writer = { version = "0.9.1", default-features = false }
indexmap = "2"
memchr = "2"
memmap2 = "0.9"
molly = "0.6.1"
nalgebra = { version = "0.35", default-features = false, features = ["std"] }
netcdf-reader = { version = "0.9.1", default-features = false }
netcdf-writer = { version = "0.9.1", default-features = false }
num-traits = "0.2"
numpy = "0.29"
pyo3 = "0.29"
smallvec = { version = "1", features = ["union"] }
thiserror = "2"
toml = "0.9"
tempfile = "3"
wide = "1.6"
zstd = "0.13"
arrow = { version = "59", default-features = false, features = ["ffi", "ipc"] }
parquet = { version = "59", default-features = false, features = ["arrow", "zstd"] }
proptest = "1"
quick-xml = "0.38"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rayon = "1"
rmp-serde = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
serde_repr = "0.1"
sha2 = "0.10"
tng-rs = "0.3"

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
# Absence is always handled with an explicit match, so that what happens when a
# value is missing is written down at the site rather than implied by a default.

[profile.release]
# Twenty-seven crates with cross-crate generics and per-atom calls that cross
# crate boundaries. Without link-time optimisation and a single code generation
# unit, those calls are never inlined, which is where most of the difference
# lies. Declaring the profile here rather than inheriting the host's settings
# also makes a release build reproducible between machines.
lto = "thin"
codegen-units = 1
# Worker-panic recovery and the Python exception mapping both unwind. Aborting
# would convert a recoverable worker fault into process death inside an
# interpreter, so this is a correctness setting, not a tuning one.
panic = "unwind"

[profile.bench]
debug = 1
# Keep optimized benchmark code while avoiding the release profile's link-time
# optimisation, which makes the complete Criterion target matrix impractical to
# build.
lto = false
codegen-units = 16
strip = "none"
