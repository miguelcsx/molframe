[package]
name = "molframe-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Mechanical Python bindings for molframe"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
arrow.workspace = true
numpy.workspace = true
molframe = { path = "../molframe", version = "0.1.0", features = ["full"] }
# 91 types carry more than one `#[pymethods]` block, and for some of them the
# blocks are in different modules: `PyAtoms` is declared in `core/atom.rs` and
# given its Arrow methods in `ml/arrow.rs`.  The feature is what lets one Rust
# type stay one Python type instead of being split at the file boundary.
pyo3 = { workspace = true, features = ["multiple-pymethods"] }

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
# PyO3 extracts public call arguments by value and exposes flat typed
# constructors.  These three lints describe the FFI signature rather than the
# native kernel and would otherwise force copies or untyped dict-based APIs.
needless_pass_by_value = "allow"
trivially_copy_pass_by_ref = "allow"
too_many_arguments = "allow"
# PyO3 exposes trait-shaped instance methods even when a native policy method
# is independent of the receiver; changing these to static methods would
# change the public Python contract rather than improve the native kernel.
unused_self = "allow"
manual_unwrap_or_default = "allow"
manual_unwrap_or = "allow"
