[package]
name = "molframe-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Mechanical Python bindings for molframe"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
numpy.workspace = true
molframe = { path = "../molframe", version = "0.1.0", default-features = false }
pyo3.workspace = true

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
# PyO3 extracts public call arguments by value and exposes flat typed
# constructors.  These three lints describe the FFI signature rather than the
# native kernel and would otherwise force copies or untyped dict-based APIs.
needless_pass_by_value = "allow"
trivially_copy_pass_by_ref = "allow"
too_many_arguments = "allow"
# PyO3 exposes trait-shaped instance methods even when a native policy method
# is independent of the receiver; changing these to static methods would
# change the public Python contract rather than improve the native kernel.
unused_self = "allow"
manual_unwrap_or_default = "allow"
manual_unwrap_or = "allow"

[features]
default = ["full"]
formats = ["molframe/mmcif", "molframe/pdb"]
query = ["molframe/query"]
geometry = ["molframe/geometry"]
chemistry = ["molframe/chemistry"]
analysis = ["geometry", "chemistry", "molframe/analysis", "molframe/interop"]
full = ["formats", "query", "analysis", "molframe/full"]
