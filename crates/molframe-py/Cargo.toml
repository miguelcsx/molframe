[package]
name = "molframe-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Mechanical Python bindings for molframe"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
numpy.workspace = true
molframe = { path = "../molframe", version = "0.4.0", default-features = false }
pyo3.workspace = true

[lints]
workspace = true

[features]
default = ["full"]
formats = ["molframe/mmcif", "molframe/pdb", "molframe/bcif"]
query = ["molframe/query"]
# Reading and selection are the module root every domain builds on.
base = ["formats", "query"]
geometry = ["base", "molframe/geometry"]
chemistry = ["base", "molframe/chemistry"]
validation = ["analysis", "molframe/validation"]
crystal = ["base", "molframe/crystal"]
spatial = ["geometry", "molframe/spatial"]
trajectory = ["base", "molframe/trajectory"]
surface = ["geometry", "molframe/surface"]
sequence = ["base", "molframe/sequence"]
compare = ["geometry", "molframe/compare"]
motif = ["chemistry", "molframe/motif"]
analysis = ["geometry", "chemistry", "molframe/analysis", "molframe/interop"]
full = ["base", "analysis", "crystal", "surface", "compare", "sequence", "validation", "spatial", "trajectory", "motif", "molframe/full"]
