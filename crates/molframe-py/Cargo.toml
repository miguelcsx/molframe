[package]
name = "molframe-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Mechanical Python bindings for molframe"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
numpy.workspace = true
molframe = { path = "../molframe", version = "0.1.0", default-features = false }
pyo3.workspace = true

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn"

[features]
default = ["full"]
formats = ["molframe/mmcif", "molframe/pdb"]
query = ["molframe/query"]
geometry = ["molframe/geometry"]
chemistry = ["molframe/chemistry"]
analysis = ["geometry", "chemistry", "molframe/analysis", "molframe/interop"]
full = ["formats", "query", "analysis", "molframe/full"]
