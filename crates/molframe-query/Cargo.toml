[package]
name = "molframe-query"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Typed and textual structural selection plans for molframe"

[dependencies]
molframe-chem.workspace = true
molframe-core.workspace = true

[dev-dependencies]
criterion.workspace = true
molframe-bench.workspace = true
molframe-cif.workspace = true
# Path-only, deliberately, not `.workspace = true`. `molframe-spatial` depends
# on this crate, so a versioned dev-dependency here is a cycle between the two
# published manifests: the packaged `molframe-query` would require a registry
# copy of `molframe-spatial`, which in turn requires `molframe-query`, and no
# publish order exists. Cargo drops a path-only dev-dependency from the packaged
# manifest, which is the sanctioned way to break such a cycle while leaving the
# benchmark below able to link both crates from this workspace.
molframe-spatial = { path = "../molframe-spatial" }

[[bench]]
name = "query"
harness = false

[lints]
workspace = true
