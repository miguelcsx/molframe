[package]
name = "pdbiox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A batteries-included structural bioinformatics engine"

[dependencies]
pdbiox-core.workspace = true
pdbiox-bcif = { workspace = true, optional = true }
pdbiox-cif = { workspace = true, optional = true }
pdbiox-chem = { workspace = true, optional = true }
pdbiox-geom = { workspace = true, optional = true }
pdbiox-ic = { workspace = true, optional = true }
pdbiox-ml = { workspace = true, optional = true }
pdbiox-pdb = { workspace = true, optional = true }
pdbiox-query = { workspace = true, optional = true }
pdbiox-spatial = { workspace = true, optional = true }
pdbiox-xtal = { workspace = true, optional = true }

[features]
default = ["mmcif", "bcif", "pdb", "geom", "ic", "query", "spatial", "chem", "xtal", "gzip", "zstd"]

# One format per feature, so a caller that reads one does not link the others.
mmcif = ["dep:pdbiox-cif"]
bcif = ["mmcif", "dep:pdbiox-bcif"]
pdb = ["dep:pdbiox-pdb"]

# Geometric kernels.
geom = ["dep:pdbiox-geom"]
ic = ["geom", "dep:pdbiox-ic"]
query = ["dep:pdbiox-query"]
spatial = ["query", "dep:pdbiox-spatial"]
chem = ["dep:pdbiox-chem"]
arrow = ["dep:pdbiox-ml"]
xtal = ["dep:pdbiox-xtal", "spatial"]

# Ways of getting bytes in.
gzip = ["pdbiox-core/gzip"]
zstd = ["pdbiox-core/zstd"]
mmap = ["pdbiox-core/mmap"]

full = ["mmcif", "bcif", "pdb", "geom", "ic", "query", "spatial", "chem", "xtal", "arrow", "gzip", "zstd", "mmap"]

[lints]
workspace = true
