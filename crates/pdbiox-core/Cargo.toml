[package]
name = "pdbiox-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Core types, storage and analysis contracts for pdbiox"

# 02-architecture.md §3 layer 0: `pdbiox-core` keeps its dependency surface
# narrow. Rayon lives here because the process-wide executor is itself a core
# execution contract; mapping and decompression remain feature-gated.
[dependencies]
bytemuck.workspace = true
hashbrown.workspace = true
num-traits.workspace = true
rayon.workspace = true
smallvec.workspace = true
thiserror.workspace = true

flate2 = { workspace = true, optional = true }
pdbiox-mmap = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }

[features]
default = []
mmap = ["dep:pdbiox-mmap"]
gzip = ["dep:flate2"]
zstd = ["dep:zstd"]

[[bench]]
name = "core"
harness = false

[dev-dependencies]
criterion.workspace = true
pdbiox-bench.workspace = true

[lints]
workspace = true
