[package]
name = "molframe-chem"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Deposited-component chemistry and versioned element data for molframe"

[dependencies]
num-traits.workspace = true
molframe-cif.workspace = true
molframe-core.workspace = true
rayon.workspace = true

[dev-dependencies]
criterion.workspace = true
molframe-bench.workspace = true

[features]
# Compiles in the tables the default flows read (bonding reach, covalent
# radii, Bondi radii, metal sites; about 3 KB) and a profile naming them, as
# the last layer of every `TableStore`, so a clean machine or a target
# without a filesystem perceives bonds, infers them and measures surface
# area. Off by default: without it the library compiles in no table.
embedded-tables = []

[[bench]]
name = "chem"
harness = false

[lints]
workspace = true
